# Exceções fundamentadas aos avisos que barrariam a publicação, lidas por verificar.sh.
#
# Cada exceção diz qual aviso, em que pacote, por que ele não alcança o que é publicado ou por que
# esperar é aceitável, e até quando vale. A data de revisão fica no máximo 90 dias à frente do dia em
# que a exceção entra; vencida, a ferramenta volta a barrar o aviso até alguém revisar. A
# justificativa é pública, como o resto do repositório.
#
# Formato de cada exceção:
#
#   - id: CVE-2026-00000
#     purls:
#       - pkg:npm/pacote@1.2.3
#     statement: Por que o aviso não alcança o que é publicado, ou o que falta para corrigi-lo.
#     expired_at: 2026-12-31
#
# O purl, com o tipo, o nome e a versão do pacote, sai no relatório da ferramenta em JSON. Sem
# purls, a exceção valeria para o mesmo aviso em qualquer pacote, e por isso ele é obrigatório aqui.
# Pelo mesmo motivo, a troca de uma base muda o purl, com a versão do pacote e a do Alpine, e a
# exceção que continua precisa ganhar o purl novo na mesma troca.
vulnerabilities:
  # O proxy da VPS, o Caddy 2.11.9, traz o golang.org/x/net 0.60.0, cujo leitor de HTML entra pela
  # biblioteca de linha de comando da smallstep, que monta a ajuda dos comandos. A correção está na
  # 0.62.0, e esta exceção sai com um build do proxy com a 0.62.0 ou mais nova. Até 2026-11-28 não
  # tinha saído Caddy depois do 2.11.9.
  - id: CVE-2026-78661
    purls:
      - pkg:golang/golang.org/x/net@v0.60.0
    statement: >-
      Custo quadrático de CPU e de memória ao ler um HTML com muitos trechos curtos de texto separados
      por marcas de fim ignoradas. No proxy, o leitor de HTML só serve à ajuda dos comandos da linha de
      comando. Ao atender, o proxy limita o tamanho do corpo e encaminha a requisição à aplicação sem
      interpretar o conteúdo dela nem o da resposta, que ele no máximo comprime.
    expired_at: 2026-12-28

  # O mesmo Caddy 2.11.9 foi compilado com o Go 1.27.3. A correção está no Go 1.27.4 e no 1.26.11, e
  # nenhuma versão do Caddy compilada com eles tinha saído quando o aviso apareceu, nem até 2026-11-28.
  # Esta exceção sai com a primeira imagem do proxy compilada com um Go corrigido, depois dos 7 dias de
  # espera de toda troca de imagem.
  - id: CVE-2026-97054
    purls:
      - pkg:golang/stdlib@v1.27.3
    statement: >-
      Um servidor HTTP/1 que limita o corpo pelo MaxBytesReader pode parar com um panic quando o corpo
      passa do limite enquanto o cabeçalho da resposta é escrito. O aviso alcança o proxy: o limite de
      1 MiB do corpo usa esse leitor, e a aplicação pode responder antes de o proxy terminar de ler o
      corpo. Esperar é aceitável porque o efeito é só a queda do processo, sem leitura nem escrita de
      dado; o contêiner do proxy reinicia sozinho em segundos, o vigia avisa a indisponibilidade, e
      o serviço ainda só tem Contas de teste.
    expired_at: 2026-12-28

  # A base da imagem da cópia e da imagem do banco da VPS, o postgres 17.12 sobre o Alpine 3.24.4, traz
  # a libxml2 2.13.9-r2. A correção dos sete avisos abaixo está na 2.13.9-r3, na r4 e na r5, e nenhuma
  # base da tag trazia nenhuma delas até 2026-11-28, nem a de 2026-11-18, a mais nova. As exceções saem
  # com a primeira base que traga a r5, depois de 7 dias publicada, trocada nos dois Dockerfiles juntos.
  #
  # Nas duas imagens, ligam a libxml2 o servidor do PostgreSQL, que a usa só nas funções de XML do SQL, a
  # extensão xml2, a libxslt, a libexslt, o xsltproc e a libLLVM. O sistema não usa XML no banco: nenhuma
  # migration nem consulta chama função de XML, e o banco só atende a aplicação, pela rede interna, com
  # consultas parametrizadas. A libxslt e a libexslt só são carregadas pela extensão xml2, que não é
  # criada no banco, e pelo xsltproc, que nenhum script das imagens chama. A libLLVM só usa a biblioteca
  # para o manifesto de programa do Windows, que a compilação do PostgreSQL não monta.
  - id: CVE-2026-86144
    purls:
      - pkg:apk/alpine/libxml2@2.13.9-r2?arch=x86_64&distro=3.24.4
    statement: >-
      O processamento de XInclude não repassa as opções de leitura do documento, entre elas a que proíbe
      buscar recurso pela rede, o que abriria injeção de entidade externa, SSRF ou lentidão. Nas duas
      imagens, só a libxslt e o xsltproc chamam o XInclude; o servidor do PostgreSQL liga a libxml2 sem
      chamá-lo. A libxslt só é carregada pela extensão xml2, que não é criada no banco: nenhuma
      migration a cria, e só um superusuário poderia, enquanto o papel da aplicação não é superusuário.
      Nenhum script das imagens chama o xsltproc.
    expired_at: 2026-12-28

  - id: CVE-2026-11979
    purls:
      - pkg:apk/alpine/libxml2@2.13.9-r2?arch=x86_64&distro=3.24.4
    statement: >-
      Estouro de pilha no utilitário xmlcatalog, no modo de linha de comando interativo, com uma linha de
      entrada longa. O utilitário não está nas imagens: a base traz só a biblioteca.
    expired_at: 2026-12-28

  - id: CVE-2026-86138
    purls:
      - pkg:apk/alpine/libxml2@2.13.9-r2?arch=x86_64&distro=3.24.4
    statement: >-
      Estouro de inteiro e de buffer no heap no dicionário de nomes, ao ler um XML com nomes prefixados.
      Nas imagens, só leem XML o servidor do PostgreSQL, nas funções de XML do SQL, que o sistema não
      usa, e os programas que só carregam com a extensão xml2 ou com o xsltproc, que não são usados.
    expired_at: 2026-12-28

  - id: CVE-2026-86139
    purls:
      - pkg:apk/alpine/libxml2@2.13.9-r2?arch=x86_64&distro=3.24.4
    statement: >-
      Estouro de inteiro ao escapar um endereço. Nas imagens, só a libxslt e a libexslt chamam a função,
      e elas só são carregadas pela extensão xml2, que não é criada, e pelo xsltproc, que nada chama.
    expired_at: 2026-12-28

  - id: CVE-2026-86140
    purls:
      - pkg:apk/alpine/libxml2@2.13.9-r2?arch=x86_64&distro=3.24.4
    statement: >-
      Estouro de pilha ao montar a mensagem de erro da validação de um XML contra a DTD dele. Só a leitura
      de XML chega a ela, e nas imagens só leem XML o servidor do PostgreSQL, nas funções de XML do SQL,
      que o sistema não usa, e os programas que só carregam com a extensão xml2 ou com o xsltproc.
    expired_at: 2026-12-28

  - id: CVE-2026-86142
    purls:
      - pkg:apk/alpine/libxml2@2.13.9-r2?arch=x86_64&distro=3.24.4
    statement: >-
      Estouro de buffer no heap ao avaliar um XPointer longo. Nas imagens, só a libxslt chama o XPointer,
      direto ou pelo XInclude, e ela só é carregada pela extensão xml2, que não é criada, e pelo xsltproc,
      que nada chama.
    expired_at: 2026-12-28

  - id: CVE-2026-86143
    purls:
      - pkg:apk/alpine/libxml2@2.13.9-r2?arch=x86_64&distro=3.24.4
    statement: >-
      Um tamanho negativo pode chegar à função que grava a saída ao escrever um XML. Nas imagens, só
      escrevem XML o servidor do PostgreSQL, nas funções de XML do SQL, que o sistema não usa, e a
      libxslt, que só é carregada pela extensão xml2, que não é criada, e pelo xsltproc, que nada chama.
    expired_at: 2026-12-28
